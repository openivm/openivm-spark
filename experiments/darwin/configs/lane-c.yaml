        mv6_state_barrier_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv6_state_barrier_wait_ms=')][0].split('=', 1)[1])
        mv6_capture_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv6_capture_wait_ms=')][0].split('=', 1)[1])
        mv6_publication_queue_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv6_publication_queue_wait_ms=')][0].split('=', 1)[1])
      artifacts:
        feedback: !eval '"\n".join(l[10:] for l in stdout if l.startswith("@FEEDBACK "))'
    prompt:
      system: |
        You are optimizing OpenIVM-Spark (Scala, spark-ext/) to reduce state-guard contention during
        concurrent materialized-view (MV) refresh. You work in lane C of five independent lanes:
        PER-MV PUBLICATION AND QUEUE.

        Lane goal: shrink how long refreshes queue for, and spend in, state publication, measured per
        MV as publication_queue_wait_ms + publication_ms. Publication currently funnels the MVs through
        a shared queue; give each MV an independent publication path (or otherwise remove the
        head-of-line blocking) while keeping every published state version complete and ordered.

        Acceptance, all required (the evaluator measures a fresh same-box baseline, median of 3
        interleaved paired runs):
          1. every correctness and crash-recovery gate passes;
          2. the lane-C waits (summed over the six MVs) drop by at least 80%;
          3. the median paired end-to-end makespan improves by at least 10%.
        Any failed gate, allowlist violation, build or test failure, or timeout scores 0.0.
        Crash points are compared one by one with the same-box baseline: a point the baseline already
        fails stays visible in the feedback and is never counted as a pass, and a candidate is only
        ACCEPTED when every non-known-gap crash point passes (recovery_qualified). Until then speed
        is exploratory.

        Editable files for lane C (repository-relative):
          owned:
            - spark-ext/ivm-common/src/main/scala/org/openivm/spark/common/rocksdb/OpenIvmStateSync.scala
          shared with other lanes (keep the diff minimal; an integrator merges):
            - spark-ext/ivm-extension/src/main/scala/org/openivm/spark/commands/MaterializedViewCommands.scala
            - spark-ext/ivm-common/src/main/scala/org/openivm/spark/common/rocksdb/OpenIvmStateBarrier.scala
        Everything else is frozen: tests, build and CI files, experiments/, and the telemetry and
        measurement files (OpenIvmExecutionSpan, RefreshProfile, PhaseTimeline, anything under
        telemetry/). Do not add, delete, rename or chmod files, and do not add symlinks or binaries.
        Darwin's required output/ protocol files are allowed.

        Facts and rules:
          - The measured spans are nested and NOT additive (for example catalog finalization runs inside
            the barrier hold, and waits overlap). Do not read a sum of spans as a critical path.
          - The evidence is local modeled latency: relative evidence only, not OneLake proof. Delta I/O
            is NOT proven to be the cause of the contention; do not assume it.
          - Never let an incrementalizable MV fall back to FULL_REFRESH. Gate: full_refresh_count == 0
            and incremental_count == 6.
          - Preserve crash-safety and the ordering of state transitions. A crash during publication
            must never expose a partially published or out-of-order state version, and recovery must
            still converge to exact results (gate: state_sync_consistent).
          - Do not move or defer work outside the measured interval (the makespan includes a final
            drain), do not serialize engine executions (concurrent engine executions must be kept), and
            do not reduce the work an MV does.
          - Do not weaken, skip or edit tests or assertions, and do not touch the evaluator.
          - A known gap is documented and out of scope: a crash between the MV-version write and the
            CDF-watermark write (MV-version/CDF-watermark).
          - Do not run builds, tests or benchmarks; the evaluator owns them. Read only the source you
            need, make one focused change, commit it and return.
      agent: |
        Reduce the lane-C waits (publication_queue_wait_ms + publication_ms). Start from
        OpenIvmStateSync.scala and trace how a refresh hands its state to publication and what it
        waits for. Read the feedback artifact from the previous evaluation first: it lists the per-MV
        queue waits, the failed gates and the first failure lines. State the mechanism you are
        changing and why published state stays complete and ordered.
