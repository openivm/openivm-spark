# Darwin lane C: per-MV publication / queue.
# Run through `darwin evolve` with the environment documented in experiments/darwin/docs/RUNNING_LANES.md:
#   OPENIVM_DARWIN_TRUSTED      checkout of the frozen harness commit that holds the trusted evaluator
#   OPENIVM_DARWIN_BASELINE_SHA the full harness commit SHA every candidate is compared against
#   OPENIVM_DARWIN_LOCK_SHA256  pinned sha256 of experiments/darwin/evaluator.lock.json
# No credentials or hosts are configured here; Darwin reads COPILOT_* from its --env-file.

experiments:
  - name: openivm-state-guard-lane-c
    executor:
      parallelism: 1
      termination:
        max_iterations: 18
        early_stopping:
          max_iterations_without_improvement: 8
          metric: combined_score
          min_improvement: 0.5
          improvement_type: absolute
    agents:
      - timeout: 3600
        models:
          - name: claude-haiku-4.5
    evaluator:
      timeout: 7200
      commands:
        - python3 "${OPENIVM_DARWIN_TRUSTED:?set OPENIVM_DARWIN_TRUSTED}/experiments/darwin/evaluator/state_guard_eval.py" --mode candidate --lane c --workspace "$PWD" --baseline-repo "${OPENIVM_DARWIN_TRUSTED}" --baseline-ref "${OPENIVM_DARWIN_BASELINE_SHA:?set OPENIVM_DARWIN_BASELINE_SHA}" --lock-sha256 "${OPENIVM_DARWIN_LOCK_SHA256:?set OPENIVM_DARWIN_LOCK_SHA256}" --pairs 3
      metrics:
        combined_score: !eval float([l for l in stdout if l.startswith('@RESULT combined_score=')][0].split('=', 1)[1])
        allowlist_gate: !eval float([l for l in stdout if l.startswith('@RESULT allowlist_gate=')][0].split('=', 1)[1])
        correctness_gate: !eval float([l for l in stdout if l.startswith('@RESULT correctness_gate=')][0].split('=', 1)[1])
        crash_gate: !eval float([l for l in stdout if l.startswith('@RESULT crash_gate=')][0].split('=', 1)[1])
        incremental_gate: !eval float([l for l in stdout if l.startswith('@RESULT incremental_gate=')][0].split('=', 1)[1])
        concurrency_gate: !eval float([l for l in stdout if l.startswith('@RESULT concurrency_gate=')][0].split('=', 1)[1])
        report_gate: !eval float([l for l in stdout if l.startswith('@RESULT report_gate=')][0].split('=', 1)[1])
        trust_gate: !eval float([l for l in stdout if l.startswith('@RESULT trust_gate=')][0].split('=', 1)[1])
        wait_reduction: !eval float([l for l in stdout if l.startswith('@RESULT wait_reduction=')][0].split('=', 1)[1])
        e2e_improvement_median: !eval float([l for l in stdout if l.startswith('@RESULT e2e_improvement_median=')][0].split('=', 1)[1])
        e2e_improvement_min: !eval float([l for l in stdout if l.startswith('@RESULT e2e_improvement_min=')][0].split('=', 1)[1])
        e2e_improvement_max: !eval float([l for l in stdout if l.startswith('@RESULT e2e_improvement_max=')][0].split('=', 1)[1])
        baseline_targeted_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT baseline_targeted_wait_ms=')][0].split('=', 1)[1])
        candidate_targeted_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT candidate_targeted_wait_ms=')][0].split('=', 1)[1])
        baseline_e2e_ms_median: !eval float([l for l in stdout if l.startswith('@RESULT baseline_e2e_ms_median=')][0].split('=', 1)[1])
        candidate_e2e_ms_median: !eval float([l for l in stdout if l.startswith('@RESULT candidate_e2e_ms_median=')][0].split('=', 1)[1])
        makespan_ms: !eval float([l for l in stdout if l.startswith('@RESULT makespan_ms=')][0].split('=', 1)[1])
        baseline_e2e_spread: !eval float([l for l in stdout if l.startswith('@RESULT baseline_e2e_spread=')][0].split('=', 1)[1])
