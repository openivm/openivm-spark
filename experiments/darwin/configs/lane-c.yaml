        mv3_state_barrier_hold_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv3_state_barrier_hold_ms=')][0].split('=', 1)[1])
        mv3_state_barrier_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv3_state_barrier_wait_ms=')][0].split('=', 1)[1])
        mv3_capture_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv3_capture_wait_ms=')][0].split('=', 1)[1])
        mv3_publication_queue_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv3_publication_queue_wait_ms=')][0].split('=', 1)[1])
        mv4_submit_to_ack_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv4_submit_to_ack_ms=')][0].split('=', 1)[1])
        mv4_state_barrier_hold_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv4_state_barrier_hold_ms=')][0].split('=', 1)[1])
        mv4_state_barrier_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv4_state_barrier_wait_ms=')][0].split('=', 1)[1])
