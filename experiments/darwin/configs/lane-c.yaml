        barrier_hold_overlap_ms_baseline_median: !eval float([l for l in stdout if l.startswith('@RESULT barrier_hold_overlap_ms_baseline_median=')][0].split('=', 1)[1])
        barrier_hold_overlap_ms_candidate_median: !eval float([l for l in stdout if l.startswith('@RESULT barrier_hold_overlap_ms_candidate_median=')][0].split('=', 1)[1])
        mv1_submit_to_ack_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv1_submit_to_ack_ms=')][0].split('=', 1)[1])
        mv1_state_barrier_hold_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv1_state_barrier_hold_ms=')][0].split('=', 1)[1])
        mv1_state_barrier_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv1_state_barrier_wait_ms=')][0].split('=', 1)[1])
        mv1_capture_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv1_capture_wait_ms=')][0].split('=', 1)[1])
        mv1_publication_queue_wait_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv1_publication_queue_wait_ms=')][0].split('=', 1)[1])
        mv2_submit_to_ack_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv2_submit_to_ack_ms=')][0].split('=', 1)[1])
        mv2_state_barrier_hold_ms: !eval float([l for l in stdout if l.startswith('@RESULT mv2_state_barrier_hold_ms=')][0].split('=', 1)[1])
