# Darwin lane E: incremental state shipping.
# Replace every "<...>" placeholder before `darwin run` (see experiments/darwin/README.md):
#   source.ref, source.options.repository, container.options.path,
#   evaluator.options.baseline_ref, evaluator.options.lock_sha256, agents[0].models[0].name
name: openivm-state-guard-lane-e

executor:
  parallelism: 1
  termination:
    max_iterations: 18
    early_stopping:
      max_iterations_without_improvement: 8
      metric: combined_score
      min_improvement: 0.5
      improvement_type: absolute

source:
  provider: git
  ref: "<BASELINE_REF>"
  options:
    repository: "<REPOSITORY_URL_OR_LOCAL_PATH>"

container:
  provider: passthrough
  options:
    path: "<DARWIN_RUNTIME_DIR>/containers"

prompt:
  system: |
    You are optimizing OpenIVM-Spark (Scala, spark-ext/) to reduce state-guard contention during
    concurrent materialized-view (MV) refresh. You work in lane E of five independent lanes:
    INCREMENTAL STATE SHIPPING.

    Lane goal: stop re-uploading the full RocksDB state on every publication. Ship only what
    changed since the last published version (an incremental or delta state format) so the bytes
    uploaded per refresh batch fall. The targeted metric is counts.state_sync.bytes_uploaded; the
    number of state-sync write operations is reported for information only.

    Acceptance, all required (the evaluator measures a fresh same-box baseline, median of 3
    interleaved paired runs):
      1. every correctness and crash-recovery gate passes;
      2. the bytes uploaded to state sync drop by at least 80%;
      3. the median paired end-to-end makespan improves by at least 10%.
    Any failed gate, allowlist violation, build or test failure, or timeout scores 0.0.

    Editable files for lane E (repository-relative):
      owned (new files only; the names must match exactly):
        - spark-ext/ivm-common/src/main/scala/org/openivm/spark/common/rocksdb/OpenIvmStateDelta*.scala
        - spark-ext/ivm-common/src/main/scala/org/openivm/spark/common/rocksdb/OpenIvmStateSyncCodec*.scala
      shared with other lanes (keep the diff minimal; an integrator merges):
        - spark-ext/ivm-common/src/main/scala/org/openivm/spark/common/rocksdb/OpenIvmStateSync.scala
    Lane E is the only lane that may add files, and only with the names above. Everything else is
    frozen: tests, build and CI files, experiments/, and the telemetry and measurement files
    (OpenIvmExecutionSpan, RefreshProfile, PhaseTimeline, anything under telemetry/). Do not
    delete, rename or chmod files, and do not add symlinks or binaries. Darwin's required output/
    protocol files are allowed.

    Facts and rules:
      - The measured spans are nested and NOT additive (for example catalog finalization runs inside
        the barrier hold, and waits overlap). Do not read a sum of spans as a critical path.
      - The evidence is local modeled latency: relative evidence only, not OneLake proof. Delta I/O
        is NOT proven to be the cause of the contention; do not assume it.
      - Never let an incrementalizable MV fall back to FULL_REFRESH. Gate: full_refresh_count == 0
        and incremental_count == 6.
      - Preserve crash-safety and the ordering of state transitions: a delta must never become
        visible before the base it depends on is durable. A restored state must be equivalent in
        effect to a full snapshot: recovery from a base snapshot plus deltas must converge to exact
        results, and a crash during shipping must never leave a delta chain that cannot be
        replayed (gates: state_sync_consistent and the crash suite). Keep a safe fallback to a
        full snapshot when the chain is missing or stale; that is a state-sync fallback, never an
        MV FULL_REFRESH.
      - Do not move or defer work outside the measured interval (the makespan includes a final
        drain), do not serialize engine executions, and do not cut the uploaded bytes by dropping
        state that a later refresh or recovery needs.
      - Do not weaken, skip or edit tests or assertions, and do not touch the evaluator.
      - A known gap is documented and out of scope: a crash between the MV-version write and the
        CDF-watermark write (MV-version/CDF-watermark).
      - Do not run builds, tests or benchmarks; the evaluator owns them. Read only the source you
        need, make one focused change, commit it and return.
  agent: |
    Reduce counts.state_sync.bytes_uploaded. Start from OpenIvmStateSync.scala and trace what is
    uploaded on each publication and how it is restored. Put the delta logic in new
    OpenIvmStateDelta*.scala files and keep the edits to OpenIvmStateSync.scala small. Read the
    feedback artifact from the previous evaluation first: it lists the baseline and candidate
    bytes, the failed gates and the first failure lines. State the mechanism you are changing and
    why recovery still converges.

samplers:
  - provider: islands
    options:
      population_size: 12
      num_islands: 2
      archive_size: 12
      feature_dimensions:
        - combined_score
        - wait_reduction
        - e2e_improvement_median

evaluator:
  path: ../evaluator/darwin_evaluator.py
  timeout: 5400
  retries: 0
  builtin_metrics: []
  options:
    lane: e
    baseline_ref: "<BASELINE_SHA>"
    spark_target: spark-3.5
    pairs: 3
    lock_sha256: "<SHA256_OF_evaluator.lock.json>"

agents:
  - models:
      - name: "<MODEL_NAME>"
        timeout: 3600
