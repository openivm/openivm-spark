name: state-guard-perf

# Manual only: the suite measures modeled-latency concurrent refreshes and kills JVMs, so it never runs on PRs.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Spark target
        type: choice
        options: [spark-3.5, spark-4.1]
        default: spark-3.5
      latency_scale:
        description: Multiplier applied to the modeled state-sync and catalog filesystem latency
        type: string
        default: '1.0'
      catalog_backend:
        description: Catalog backend under test
        type: choice
        options: [delta, rocksdb]
        default: delta

concurrency:
  group: state-guard-perf-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  state-guard-perf:
    name: State-guard perf (${{ inputs.target }})
    runs-on: [self-hosted, openivm-spark-azure]
    timeout-minutes: 120
    container:
      image: ghcr.io/openivm/openivm-spark-devcontainer:09a5d1572aca7d969f8b087bee443f3c254fa86943e597758aa8f1b2d9591c2e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      NX_DAEMON: 'false'
      OPENIVM_STATE_GUARD_REPORT_DIR: ${{ github.workspace }}/.logs/state-guard-perf
      OPENIVM_STATE_GUARD_LATENCY_SCALE: ${{ inputs.latency_scale }}
      OPENIVM_STATE_GUARD_CATALOG_BACKEND: ${{ inputs.catalog_backend }}
      OPENIVM_STATE_GUARD_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install locked tooling from the warmed cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install target Py4J
        shell: bash
        env:
          SPARK_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          py4j_dir="$(mktemp -d "$RUNNER_TEMP/openivm-py4j-$SPARK_TARGET.XXXXXX")"
          python3 -m pip install --no-cache-dir --no-deps --only-binary=:all: --require-hashes \
            --target "$py4j_dir" -r "spark-ext/dev/requirements-py4j-$SPARK_TARGET.txt"
          printf 'PYTHONPATH=%s%s\n' "$py4j_dir" "${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: State-guard perf and crash recovery
        run: >-
          npx --no-install nx run spark-ext:state-guard-perf
          --configuration=${{ inputs.target }}

      - name: Upload state-guard reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: state-guard-perf-${{ inputs.target }}-${{ github.run_id }}
          path: .logs/state-guard-perf/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-state-guard-${{ inputs.target }}-${{ github.run_id }}
          path: .logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
