name: temporary assembly recovery
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  assembly:
    runs-on: [self-hosted, openivm-spark-azure]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [spark-3.5, spark-4.1]
    container:
      image: ghcr.io/openivm/openivm-spark-devcontainer@sha256:8f66308decb881f370ad5acb7217dda85cd121917a36f87f173d6222bd51ee40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      OPENIVM_NATIVE_DIR: /opt/openivm
    steps:
      - name: Checkout exact keeper
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: d40c352727f12b992e2f38b44c8cb100a444135e
          fetch-depth: 0
      - name: Install locked tooling
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build exact-source assembly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d40c352727f12b992e2f38b44c8cb100a444135e
          npx --no-install nx run spark-ext:assembly --configuration=${{ matrix.target }}
          mapfile -t jars < <(find spark-ext/ivm-extension/target -name '*assembly*.jar' -type f)
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}"
          for file in duckdb openivm.duckdb_extension; do
            expected="$(sha256sum "/opt/openivm/$file" | cut -d' ' -f1)"
            actual="$(unzip -p "${jars[0]}" "openivm-native/$file" | sha256sum | cut -d' ' -f1)"
            test "$actual" = "$expected"
            echo "$file $actual"
          done
      - name: Preserve assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keeper-${{ matrix.target }}-${{ github.run_id }}
          path: spark-ext/ivm-extension/target/**/*assembly*.jar
          if-no-files-found: error
          retention-days: 7
