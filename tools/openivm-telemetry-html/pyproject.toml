[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openivm-telemetry-html"
version = "0.1.0"
description = "Stdlib-only HTML renderer for OpenIVM CREATE and REFRESH telemetry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ipython = ["ipython"]

[tool.setuptools]
packages = ["openivm_telemetry_html"]
